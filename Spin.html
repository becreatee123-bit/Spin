<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin the Bottle</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1a3a;--card:#14295c;--ac:#7fd0ff;--tx:#eef6ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body[data-t=warm]{--bg:#3a1500;--card:#5e2506;--ac:#ffa14a;--tx:#fff3e6}
body[data-t=honey]{--bg:#3a0f2a;--card:#5c1944;--ac:#ff86bd;--tx:#fff0f7}
body[data-t=dare]{--bg:#1d0a3d;--card:#33156b;--ac:#d38bff;--tx:#fbf3ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;transition:background .6s,color .6s}
#app{width:100%;max-width:440px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{margin:2px 0;font-size:24px;color:var(--ac)}
.wrap{position:relative;width:320px;height:320px;display:flex;align-items:center;justify-content:center}
.mk{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:2px solid var(--ac);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1;transition:transform .4s,background .4s}
.mk small{font-size:9px;font-weight:700;letter-spacing:.05em;margin-top:2px;text-transform:uppercase}
.mk.on{background:var(--ac);color:#111;transform:scale(1.25)}
.pl{width:100%;text-align:center}
.pl input{width:70%;text-align:center;font:inherit;font-weight:700;background:var(--card);border:0;border-radius:12px;color:var(--tx);padding:8px}
.pl span{display:block;font-size:26px;font-weight:800;color:var(--ac)}
.ring{width:270px;height:270px;border-radius:50%;border:4px dashed var(--ac);background:radial-gradient(circle,var(--card),transparent 70%);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 30px var(--ac)}
#b{width:90px;height:230px;transition:transform 3.6s cubic-bezier(.1,.7,.12,1)}
.card{width:100%;background:var(--card);border-radius:18px;padding:16px;text-align:center}
.q{font-size:20px;font-weight:700;margin:6px 0}.big{font-size:44px}
.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.btn{width:100%;margin-top:8px;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800;background:var(--ac);color:#111;cursor:pointer}
.btn.g{background:transparent;border:2px solid var(--ac);color:var(--ac)}
</style></head><body data-t="cool"><div id="app"></div>
<script>
const D={
cool:["Does God exist? What makes you lean that way?","If God exists, why is there still suffering?","Is feminism still needed today? Where do you see it?","What is toxic masculinity, in your own words?","Why are boys told not to cry?","Is sexism more visible at work or at home?","Should household work be split 50-50?","Are men and women truly equal in India today?","Why do we judge a woman's character by her clothes?","Is it harder to be a man or a woman today? Why?","What is misogyny, and where do you notice it daily?","Should the husband be the head of the home?","Is fascism old history, or can it return?","How does a country slide toward dictatorship?","Is it okay to give up freedom for safety?","Which historical leader do you admire, and which can't you stand?","Does history repeat, or just rhyme?","Is national pride good or dangerous?","Can a person be good without any religion?","What do you think happens after we die?","Is free will real or an illusion?","Is it wrong to lie to protect someone?","Does money buy happiness?","Is it selfish to put yourself first?","What makes a life meaningful?","Should the rich be taxed much more?","Is arranged marriage outdated?","Should marriage even exist?","Is it hard for men to express feelings? Why?","Is the 'good girl' idea fair to women?","Who should lead the family in a crisis?","Is social media making us lonelier?","Should we follow tradition if it feels unfair?","Is revenge ever justified?","Do we owe our parents everything?","Is patriarchy hurting men too?","Should women have to choose between career and family?","What would a fair society look like to you?","Is it okay for a woman to propose?","Does caste still matter in everyday life?","Is violence ever the answer to injustice?","Is it better to be loved or respected?","Are humans naturally good or selfish?","Should kids learn about gender equality early?","Is anyone truly self-made?","Can you separate an artist from their views?","Would you want to know the day you die?","Is peace possible without justice?","Which belief of yours changed most as you grew up?","If you ran the country for a day, what would you do first?"],
warm:["Tell about a friendship that changed you.","Describe your best day ever.","Describe your worst day, and what got you through it.","Tell about a relationship that ended, and what you learned.","What is your happiest childhood memory?","Who is your best friend, and why?","What small thing makes your whole day better?","What are you secretly proud of?","What was the last thing that made you cry?","What do you do when you feel low?","Describe your ideal life in 10 years.","What does a perfect ordinary day look like?","What would you do if money was never a problem?","Who do you miss most right now?","What is one rule you try to live by?","What is the bravest thing you've done?","What is your biggest fear about the future?","What mistake are you glad you made?","Who has influenced you most in life?","What is a dream you've never told anyone?","What is your comfort food, and why?","What is your favorite place in the world?","How do you want to be remembered?","What is the best advice you've ever received?","Describe the home you grew up in.","What talent do you wish you had?","What habit do you want to change?","When did you last feel truly free?","What would you tell your younger self?","Which place are you dreaming of visiting?","What's your most awkward memory? Laughing allowed.","Which song takes you back to a moment?","Which book or film changed you?","What do you value most in a friend?","What do you love most about your family?","What do you wish people understood about you?","What's your idea of a perfect lazy Sunday?","What makes you feel most understood?","What's the kindest thing a stranger did for you?","How do you celebrate a win?","What are you still learning?","What do you do when you can't sleep?","If you could live anywhere, where?","What do you want your home to feel like?","What is one thing you'd never compromise on?","Which quality of yours are you proudest of?","What makes you laugh the hardest?","What's the weirdest thing you believe in?","What's the best memory you've made this year?","What's one thing on your bucket list?"],
honey:["Do you have a crush on someone right now?","Does look really matter to you? How much?","What's the first thing you notice in someone you like?","What do you find most attractive in a personality?","Do you think someone is hinting they like you but can't say it?","What makes a smile or a voice unforgettable?","What's your idea of a perfect date?","What's the most romantic thing someone could do for you?","Love at first sight: real, or just a story?","What's a green flag that makes you smile?","What's a red flag you can't ignore?","Texting or calling: which says 'I like you' more?","What's the sweetest compliment you've received?","Would you rather be adored or challenged by a partner?","What do you find attractive in how someone treats others?","What gesture would make you blush?","What instantly makes someone more attractive?","Do opposites really attract?","How do you act around someone you like?","Who was your first crush? What was it about them?","What would you want a partner to know about you right away?","What's your love language: words, time, gifts, or touch?","Is it okay to say 'I like you' first?","What's the best way to tell someone you like them?","What small thing makes your heart skip?","Do you prefer a slow start or a quick spark?","What does a comfortable silence mean to you?","What kind of smile or eyes catches you?","What do you notice first: hands, style, or walk?","What's the most attractive way to be confident?","What would your ideal evening with someone look like?","What's one thing you've noticed about me that you like?","Do you believe in soulmates?","What's the best love story you know?","What does feeling cared for look like to you?","Would you text first, or wait?","Have you ever liked someone and never told them?","What's your type? Is it changing?","Which song feels like a crush?","Who would you want to talk to at 3 AM?","What's your most romantic memory?","Do you fall for a person, or for their vibe?","What would make you say yes to a second date?","If someone liked you quietly, how would you want them to show it?","Which is more attractive: humor, intellect, or kindness?","Would you rather hold hands or get a handwritten note?","What's one thing you'd love to hear from someone you like?","What makes you feel special to someone?","What makes someone hard to forget?","If this game was a hint, would you notice it?","What's your wildest fantasy? Share as much as you're comfortable with.","What's the wildest thing you've ever experienced with someone you liked?","What's the boldest thing you've done to get someone's attention?","What's the most daring message you've ever sent a crush?","Where's the most unexpected place you've ever shared a kiss?","What's your most shameless flirting move?","What's something you've done on a date that you'd never tell your parents?","What would make you say yes to a spontaneous late-night plan?","What's the most memorable thing someone has ever whispered to you?","Have you ever been caught staring at someone? What happened?","What's the riskiest thing you've done for a crush?","What do you find irresistible in someone's voice or touch?","What's your guilty pleasure when it comes to romance?","What's a love secret you'd only tell someone you trust completely?","If you had one perfect night with no limits, what would it look like?","What's the most attractive thing a person can do without trying?","Is playing hard to get attractive, or just annoying?","What's the boldest thing you've seen someone do to impress a crush?","Why do people look away when caught staring at someone they like?","Is a lingering hug a hint, or just a hug?","What's the worst flirting mistake you've seen?","Do people fall faster for looks, voice, or humor?","Is it okay to flirt with someone who's taken?","Why do people text a crush at midnight?","What's the biggest sign someone is falling for you, even if they deny it?","Is jealousy cute or a red flag?","Do people say more through eye contact or words?","What's the most overrated romantic gesture?","Are the quiet ones the boldest in love?","Why do people go silent after a great date?","Can two people be just friends without one secretly wanting more?","What does it say about someone who flirts with everyone?","Are situationships exciting or exhausting?","Which is more attractive: mysterious or an open book?","What makes a first kiss unforgettable?","Do most people prefer being chased or doing the chasing?","Can chemistry be faked?","Who flirts better, men or women, and why?","Should you tell someone you've been thinking about them all day?","Why do people want what they can't have in love?"],
dare:["Describe the other person in exactly 3 words.","Tell one thing you honestly like about the other person.","Do your best news-anchor voice for 10 seconds.","Sing one line of any song with full confidence.","Share your most embarrassing nickname.","Show the last photo in your gallery and explain it.","Take a selfie right now, exactly as you look, and show it.","Confess a harmless secret, like a silly habit.","Give the other person a made-up nickname.","Give a dramatic 10-second speech about tea.","Say a compliment in the most dramatic way you can.","Describe this evening as if telling a friend.","Do your best impression of a famous person.","Dance for 5 seconds, no music.","Finish 'I like...' three times, quickly.","Show the funniest photo or meme on your phone.","Reveal your most-played song lately.","Tell a bad joke with a straight face.","Name three things that make you smile instantly.","Make the other person laugh within 20 seconds.","Tell what you first thought of them when you met.","Share a small thing you've wanted to say but haven't.","Hold eye contact for 5 seconds without laughing.","Whisper your next sentence.","Describe your day like a movie trailer.","Say one thing you admire about the other person's mind.","Act out your favorite hobby without words.","Rate the other person's vibe 1 to 10 and explain.","Tell your most awkward moment this year.","Show your phone wallpaper and its story.","Hum a song that matches this moment.","Say your name like a movie villain.","Tell what you'd cook for the other person.","Describe your dream trip in one breath.","Tell about the last time you laughed really hard.","Say something nice about the other person's smile or laugh.","Do a slow-motion victory celebration.","Share a small hint of something you like about them.","Say a tongue twister three times fast.","Give a 10-second talk on why you're the better player."]};
const EM={cool:"❄️",warm:"🔥",honey:"🍯"},NAME={cool:"Cool",warm:"Warm",honey:"Honey"};
const nm=["Player 1","Player 2"],sc=[0,0],dk={};
let cat="cool",mode="idle",who=0,txt="",deg=0,sp=false;
const $=document.getElementById("app");
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const draw=k=>{if(!dk[k]||!dk[k].length)dk[k]=sh(D[k]);return dk[k].pop()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bottle=()=>`<svg id="b" viewBox="0 0 90 230" style="transform:rotate(${deg}deg)"><path d="M38 6h14v52c0 14 26 22 26 52v100c0 10-8 16-18 16H30c-10 0-18-6-18-16V110c0-30 26-38 26-52z" fill="var(--ac)" opacity=".9"/><rect x="38" y="2" width="14" height="10" rx="3" fill="var(--tx)"/><rect x="24" y="120" width="42" height="56" rx="8" fill="var(--bg)" opacity=".35"/><text x="45" y="156" text-anchor="middle" font-size="26">🍾</text></svg>`;
function render(){
 document.body.dataset.t=mode=="dare"?"dare":cat;
 let c="";
 if(mode=="q")c=`<div class="card"><div class="big">${EM[cat]}</div><div class="tag">${NAME[cat]} question for ${esc(nm[who])}</div><div class="q">${esc(txt)}</div><button class="btn" onclick="fin()">Answered ✅ +1</button><button class="btn g" onclick="pass()">Pass 🎲 take a dare</button></div>`;
 else if(mode=="dare")c=`<div class="card"><div class="big">😈</div><div class="tag">Dare for ${esc(nm[who])}</div><div class="q">${esc(txt)}</div><button class="btn" onclick="fin()">Go! Done 🎉 +1</button></div>`;
 else c=`<div class="card"><div class="tag" id="st">${sp?"Spinning...":"Tap the bottle to spin"}</div></div>`;
 const mk=["cool","warm","honey"].map((k,i)=>{const a=i*120*Math.PI/180;return `<div class="mk ${mode!="idle"&&cat==k?"on":""}" style="left:${160+Math.sin(a)*135}px;top:${160-Math.cos(a)*135}px">${EM[k]}<small>${NAME[k]}</small></div>`}).join("");
 $.innerHTML=`<h1>🍾 Spin the Bottle</h1>
 <div class="pl"><span>${sc[1]}</span><input value="${esc(nm[1])}" oninput="nm[1]=this.value" maxlength="14"></div>
 <div class="wrap" onclick="spin()">${mk}<div class="ring">${bottle()}</div></div>
 <div class="pl"><input value="${esc(nm[0])}" oninput="nm[0]=this.value" maxlength="14"><span>${sc[0]}</span></div>${c}`;
}
let turn=Math.random()*2|0,spins=0,rigNow=false,rigPass=false;
const RIG_SPIN=13,RIG_PLAYER=1,RIG_Q="If the other player proposed to you right now, would you accept?",RIG_DARE="Tell the truth. If someone proposed to you, what would be your reason for saying no?";
function spin(){
 if(sp||mode!="idle")return;sp=true;spins++;rigNow=(spins===RIG_SPIN);
 const st=document.getElementById("st");if(st)st.textContent="Spinning...";
 const b=document.getElementById("b");deg+=1440+Math.random()*1080;
 if(rigNow)deg=Math.ceil(deg/360)*360+240+(Math.random()*40-20);
 requestAnimationFrame(()=>{b.style.transform=`rotate(${deg}deg)`});
 setTimeout(()=>{
  if(rigNow){cat="honey";turn=RIG_PLAYER;who=RIG_PLAYER;txt=RIG_Q;rigPass=true;rigNow=false}
  else{const f=((deg%360)+360)%360;cat=["cool","warm","honey"][Math.round(f/120)%3];who=turn;txt=draw(cat)}
  mode="q";sp=false;render()},3800)}
function pass(){if(rigPass){txt=RIG_DARE;rigPass=false}else txt=draw("dare");mode="dare";render()}
function fin(){rigPass=false;sc[who]++;turn=1-turn;mode="idle";render()}
render();
</script></body></html>
